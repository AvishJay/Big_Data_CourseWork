# Start:   docker compose up -d
# Verify:  http://localhost:8086  (login with the credentials below)

services:
  influxdb:
    image: influxdb:2.7
    container_name: influxdb-task1
    restart: unless-stopped
    ports:
      - "8086:8086"                      
    volumes:
      # Persistent storage: host directory -> internal engine path
      - ./influxdb-data:/var/lib/influxdb2
      - ./influxdb-config:/etc/influxdb2
    environment:
      # --- Automatic first-run bootstrap (org / bucket / admin user) ---
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: BigData2026!
      DOCKER_INFLUXDB_INIT_ORG: default
      DOCKER_INFLUXDB_INIT_BUCKET: weather_raw
      DOCKER_INFLUXDB_INIT_RETENTION: 0            # 0 = infinite; shard-group duration is
                                                     # widened to 2160h (90d) post-boot (see README) so
                                                     # bulk-loading the 10-year historical CSV doesn't
                                                     # time out creating dozens of shards per write batch
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: bigdata-supersecret-token
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
