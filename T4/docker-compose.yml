version: "3.9"

#   docker compose up -d
#   Browser UI: http://localhost:17474 (Bolt: neo4j://localhost:17687)
#   Login: neo4j / BigData2026!

services:
  neo4j:
    image: neo4j:5-community
    container_name: neo4j-task4
    restart: unless-stopped
    ports:
      - "17474:7474"        
      - "17687:7687"        
    environment:
      NEO4J_AUTH: neo4j/BigData2026!
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1g
    volumes:
      - ./neo4j-data:/data           
      - ./import:/var/lib/neo4j/import   
